const fatK=Math.round(tgt*0.25),fat=Math.round(fatK/9*10)/10;
let carbK=Math.max(0,tgt-pro*4-fatK);
let carb=Math.round(carbK/4);
const tot=pro*4+carb*4+fat*9;
return {bmr:Math.round(bmr),tdee:Math.round(tdee),tgt:Math.round(tgt),pro,carb,fat,fiber:Math.round(tgt/1000*14),water:+(o.w*0.035).toFixed(1),warned,check:tot};
}
function calc(){
const o={sex:document.getElementById('cSex').value,age:num('cAge',30),w:num('cW'),h:num('cH'),act:num('cAct',1.55),goal:document.getElementById('cGoal').value,rate:num('cRate',0.5),meals:Math.max(2,Math.min(6,Math.round(num('cMeals',4))))};
if(!(o.w>20&&o.w<400&&o.h>100&&o.h<250&&o.age>10&&o.age<100)){toast(t('needNum'));return;}
const r=calcTargets(o);curT={o,r};
const pp=r.pro/r.tgt*100,cc=r.carb*4/r.tgt*100,ff=100-pp-cc;
document.getElementById('calcRes').innerHTML=`${t('bmrL')}: <b>${r.bmr}</b> · ${t('tdeeL')}: <b>${r.tdee}</b><br>${t('tgtL')}: <b class="big">${r.tgt} kcal</b><div class="macrobar"><div style="width:${pp}%;background:#f87171" title="P"></div><div style="width:${cc}%;background:#fbbf24" title="C"></div><div style="width:${ff}%;background:#60a5fa" title="F"></div></div><table class="bt"><tr><td>🥩 Protein</td><td class="n"><b>${r.pro}g</b></td></tr><tr><td>🍚 Carbs</td><td class="n"><b>${r.carb}g</b></td></tr><tr><td>🧈 Fat</td><td class="n"><b>${r.fat}g</b></td></tr><tr><td>🌾 ${t('fiberL')}</td><td class="n">${r.fiber}g</td></tr><tr><td>💧 ${t('waterL')}</td><td class="n">${r.water}L</td></tr><tr><td>🍽️ /${t('perMealL')}</td><td class="n">${Math.round(r.pro/o.meals)}P · ${Math.round(r.carb/o.meals)}C · ${Math.round(r.fat/o.meals)}F</td></tr></table>${r.warned?`<div class="warn">${t('warnLow')}</div>`:''}`;
return r;
}
function kcal100(f){return f.p*4+f.c*4+f.f*9;}
function buildSwap(){
document.getElementById('swFood').innerHTML=FOODS.map((f,i)=>`<option value="${i}">${f.n}</option>`).join('');
}
function swapGrams(src,g,mode){
const m=mode==='protein'?'p':mode==='carb'?'c':null;
const srcVal=m?src[m]:kcal100(src);
return FOODS.map(f=>{const fv=m?f[m]:kcal100(f);return {f,g:fv>0?Math.round(g*srcVal/fv):0};}).filter(x=>x.g>0&&x.g<5000);
}
function renderSwap(){
const src=FOODS[+document.getElementById('swFood').value||0]||FOODS[0];
const g=Math.max(1,num('swGram',100)),mode=document.getElementById('swMode').value;
const rows=swapGrams(src,g,mode);
const met=mode==='protein'?'p':mode==='carb'?'c':null;
document.getElementById('swapBody').innerHTML=rows.map(x=>{const f=x.f;
const pv=met?f[met]*x.g/100:kcal100(f)*x.g/100;
const cv=f.c*x.g/100,fv=f.f*x.g/100,kv=kcal100(f)*x.g/100;
return `<tr${f.n===src.n?' style="background:#0e2a1d"':''}><td><b>${f.n}</b></td><td class="n">${x.g}g</td><td class="n">${(f.p*x.g/100).toFixed(1)}</td><td class="n">${cv.toFixed(1)}</td><td class="n">${fv.toFixed(1)}</td><td class="n">${Math.round(kv)}</td></tr>`;}).join('');
}
function pickProt(need){const c=FOODS.filter(f=>f.p>=15&&['Whey','Chicken','Eggs','Tuna','Beef','Salmon','Greek'].some(k=>f.n.includes(k)));c.sort((a,b)=>(b.p/ (kcal100(b)||1))-(a.p/(kcal100(a)||1)));return c[0]||FOODS[2];}
function pickCarb(need){const c=FOODS.filter(f=>f.c>=15&&['Oats','Rice','Bread','Pasta','Potato','Banana'].some(k=>f.n.includes(k)));return c[0]||FOODS[0];}
function buildMenu(){
if(!curT)calc();if(!curT)return;
const {o,r}=curT,mp={p:r.pro/o.meals,c:r.carb/o.meals,f:r.fat/o.meals};
let h='';
for(let m=1;m<=o.meals;m++){
const pr=pickProt(),cb=pickCarb();
const gp=Math.min(400,Math.round(mp.p/(pr.p||1)*100));
const gc=Math.min(400,Math.round(mp.c/(cb.c||1)*100));
const gf=Math.max(0,Math.round((mp.f-pr.f*gp/100-cb.f*gc/100)/10)*10);
h+=`<div class="note"><b>${t('mealL')} ${m}</b> — ${pr.n} ${gp}g + ${cb.n} ${gc}g${gf>0?' + Olive oil '+gf+'g':''}<br><small>≈ ${Math.round(gp*pr.p/100)}P · ${Math.round(gc*cb.c/100)}C · ${Math.round((pr.f*gp+cb.f*gc)/100+gf)}F</small></div>`;
}
document.getElementById('menuOut').innerHTML=h;
}
function suppUrl(store,q){if(store==='iherb')return 'https://www.iherb.com/search?kw='+encodeURIComponent(q);return 'https://www.amazon.com/s?k='+encodeURIComponent(q);}
function isAff(store){return !!(CONFIG.supp&&CONFIG.supp[store]);}
function affUrl(store,q){return (CONFIG.supp&&CONFIG.supp[store])||suppUrl(store,q);}
function renderSupp(){
const SUPPS=[['whey','Whey Protein','~25g protein / serving','whey protein'],['creatine','Creatine Monohydrate','5g / day','creatine monohydrate'],['multi','Multivitamin','daily micros','multivitamin'],['omega','Omega-3 Fish Oil','EPA + DHA','omega 3 fish oil'],['vitd','Vitamin D3','2000–4000 IU','vitamin d3']];
document.getElementById('suppGrid').innerHTML=SUPPS.map(s=>`<div class="supp"><b>${s[1]}${isAff('iherb')||isAff('amazon')?'<span class="refbadge">REF</span>':''}</b><small>${s[2]}</small><br><a target="_blank" rel="nofollow sponsored noopener" href="${affUrl('iherb',s[3])}">iHerb →</a> <a target="_blank" rel="nofollow sponsored noopener" href="${affUrl('amazon',s[3])}">Amazon →</a></div>`).join('');
}
function renderDonate(){
document.getElementById('btcA').textContent=CONFIG.pay.btc;
document.getElementById('usdtA').textContent=CONFIG.pay.usdt;
}
function loadAds(){const A=CONFIG.ads,el=document.getElementById('adFoot');if(!el)return;
if(A.client){el.innerHTML='<ins class="adsbygoogle" style="display:block" data-ad-client="'+A.client+'" data-ad-slot="'+(A.slot||'')+'" data-ad-format="auto"></ins>';
if(!document.querySelector('script[src*="adsbygoogle"]')){const s=document.createElement('script');s.async=true;s.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client='+A.client;s.crossOrigin='anonymous';document.head.appendChild(s);}try{(window.adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}}
else if(A.carbonServe){el.innerHTML='';const s=document.createElement('script');s.async=true;s.id='_carbonads_js';s.src='//cdn.carbonads.com/carbon.js?serve='+A.carbonServe+'&placement='+A.carbonPlacement;el.appendChild(s);}}
setLang('en');loadAds();renderDonate();
</script>
